{% extends "layout.html" %}

{% block title %}
    <h1>Register for a new account</h1>
{% endblock %}

{% block main %}
  <h2>Register for a new account</h2>
  <form action="/register" method="post">
    <div class="mb-3">
      <input
        autocomplete="off"
        autofocus
        class="form-control mx-auto w-auto"
        name="username"
        placeholder="Username"
        type="text"
      />
    </div>
    <div class="mb-3">
      <input
        class="form-control mx-auto w-auto"
        name="password"
        placeholder="Password"
        type="password"
      />
    </div>
    <div class="mb-3">
      <input
        class="form-control mx-auto w-auto"
        name="confirmation"
        placeholder="Confirm Password"
        type="password"
      />
    </div>
    <button class="btn btn-primary" type="submit">Register new account</button>
  </form>
{% endblock %}
